<script>
'use strict';
const $ = id => document.getElementById(id);
/* ================= 4-Shade Pixel-Renderer (160x144) ================= */
const P = ['#9bbc0f', '#8bac0f', '#306230', '#0f380f'];   // hell -> dunkel
const cv = $('gb'); let g = cv.getContext('2d');
function rect(x, y, w, h, c) { g.fillStyle = P[c]; g.fillRect(Math.round(x), Math.round(y), w, h); }
function px(x, y, c) { rect(x, y, 1, 1, c); }

// 3x5 Bitmap-Schrift
const FONT = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001',
  '5':'111100111001111','6':'111100111101111','7':'111001010010010','8':'111101111101111','9':'111101111001111',
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',
  G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
  M:'101111101101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',Q:'010101101110011',R:'110101110101101',
  S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101101111101',X:'101101010101101',
  Y:'101101010010010',Z:'111001010100111','-':'000000111000000','.':'000000000000010','°':'010101010000000',
  '%':'101001010100101','/':'001001010100100',':':'000010000010000','+':'000010111010000',' ':'000000000000000'
};
function norm(s) {
  return String(s).toUpperCase().replace(/Ä/g, 'AE').replace(/Ö/g, 'OE').replace(/Ü/g, 'UE').replace(/ß/g, 'SS')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}
function txtW(s, sc = 1) { return norm(s).length * 4 * sc - sc; }
function txt(s, x, y, c, sc = 1) {
  for (const ch of norm(s)) { const gl = FONT[ch] || FONT[' '];
    for (let i = 0; i < 15; i++) if (gl[i] === '1') rect(x + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc, c);
    x += 4 * sc; }
}
function txtShadow(s, x, y, c, sh, sc = 1) { txt(s, x + 1, y + 1, sh, sc); txt(s, x, y, c, sc); }

// Sprites aus Kreisen (Wolken, Büsche) – vorgerendert
function blob(circles, fill, out, shade) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [cx, cy, r] of circles) { x0 = Math.min(x0, cx - r); y0 = Math.min(y0, cy - r); x1 = Math.max(x1, cx + r); y1 = Math.max(y1, cy + r); }
  const w = x1 - x0 + 3, h = y1 - y0 + 3; const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d');
  const inside = (a, b) => circles.some(([cx, cy, r]) => (a + x0 - 1 - cx) ** 2 + (b + y0 - 1 - cy) ** 2 <= r * r);
  for (let b = 0; b < h; b++) for (let a = 0; a < w; a++) {
    if (!inside(a, b)) continue;
    const edge = !inside(a - 1, b) || !inside(a + 1, b) || !inside(a, b - 1) || !inside(a, b + 1);
    const col = edge ? out : (b > h * 0.66 ? shade : fill);
    if (col < 0) continue; x.fillStyle = P[col]; x.fillRect(a, b, 1, 1);
  }
  return c;
}
const CLOUD = [[8, 9, 6], [16, 6, 7], [25, 8, 6], [13, 11, 5], [21, 11, 5]];
const CLOUD2 = [[6, 7, 5], [13, 5, 6], [19, 8, 5]];
const SPR = {
  cDay: blob(CLOUD, 0, 3, 1), cDay2: blob(CLOUD2, 0, 3, 1),
  cGrey: blob(CLOUD, 1, 3, 2), cGrey2: blob(CLOUD2, 1, 3, 2),
  cStorm: blob(CLOUD, 2, 3, 3), cStorm2: blob(CLOUD2, 2, 3, 3),
  cNight: blob(CLOUD, 2, 1, 3), cNight2: blob(CLOUD2, 2, 1, 3),
  bush: blob([[5, 7, 5], [11, 5, 6], [17, 7, 5]], 2, 3, 3), bushN: blob([[5, 7, 5], [11, 5, 6], [17, 7, 5]], 3, 2, 3),
  fog: (() => { const c = document.createElement('canvas'); c.width = 240; c.height = 70; const x = c.getContext('2d'); x.fillStyle = P[0];
    for (let y = 0; y < 70; y++) { const band = Math.sin(y / 5) + Math.sin(y / 13);
      for (let a = 0; a < 240; a++) { const n = band + Math.sin(a / 17 + y / 9) * 0.8;
        if (n > 0.2 && ((a + y) & 1) === 0) x.fillRect(a, y, 1, 1); else if (n > 1.2) x.fillRect(a, y, 1, 1); } }
    return c; })()
};
// Original-Figur "BIT" – kleiner Wetter-Roboter (8x10)
const BOT = {
  head: ['....3...', '..33333.', '.3000003', '.3030303', '.3000003', '.3033303', '..33333.', '..32223.'],
  legA: ['..3...3.', '.33...33'], legB: ['...3.3..', '..33.33.']
};
const UMB = ['....3333....', '..33222233..', '.3222222223.', '333333333333'];
function sprite(rows, x, y, map) {
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue; px(x + i, y + j, map ? map[+ch] : +ch); } });
}

let S = {};   // Szenen-Zustand
function resetScene() {
  const parts = []; for (let i = 0; i < 120; i++) parts.push({x: Math.random() * 200, y: Math.random() * 130, s: 0.6 + Math.random() * 0.8});
  const stars = []; for (let i = 0; i < 22; i++) stars.push({x: (Math.random() * 158) | 0, y: 18 + ((Math.random() * 60) | 0)});
  S = {f: 0, parts, stars, flash: 0, bolt: null};
}
function circle(cx, cy, r, fn) { for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) { const d = dx * dx + dy * dy; if (d <= r * r) fn(cx + dx, cy + dy, d); } }
function drawSun(cx, cy, f) {
  const ph = (f >> 3) & 1;
  for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + (ph ? Math.PI / 8 : 0);
    for (let d = 11; d <= 14 + ph; d++) px(cx + Math.cos(a) * d, cy + Math.sin(a) * d, 2); }
  circle(cx, cy, 8, (x, y, d) => px(x, y, d > 52 ? 2 : 1));
  px(cx - 4, cy - 4, 0); px(cx - 3, cy - 4, 0); px(cx - 4, cy - 3, 0);
}
function drawMoon(cx, cy) { circle(cx, cy, 7, (x, y) => { if ((x - cx - 4) ** 2 + (y - cy + 2) ** 2 > 36) px(x, y, 0); }); }
function line(x0, y0, x1, y1, c, w = 1) {
  const n = Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0)) | 0;
  for (let i = 0; i <= n; i++) { const t = n ? i / n : 0; rect(x0 + (x1 - x0) * t, y0 + (y1 - y0) * t, w, 1, c); }
}



/* ================= Rechner ================= */
// Zustand: Liste aus Zahlen (als String) und Operatoren
let toks = [];          // z.B. ['12','+','3']
let justEval = false;   // nach "=" beginnt eine Ziffer neu
let lastRes = null;
let tape = []; try { tape = JSON.parse(localStorage.getItem('rechner.tape') || '[]'); } catch (e) {}
const OPS = {'+': 1, '-': 1, '*': 2, '/': 2};
const SYM = {'+': '+', '-': '−', '*': '×', '/': '÷'};
const isOp = t => t in OPS;
const last = () => toks[toks.length - 1];

function fmt(n) {
  if (!isFinite(n)) return 'FEHLER';
  if (Object.is(n, -0)) n = 0;
  let s;
  const a = Math.abs(n);
  if (a !== 0 && (a >= 1e12 || a < 1e-9)) s = n.toExponential(6).replace(/\.?0+e/, 'e');
  else s = String(parseFloat(n.toPrecision(12)));
  return s.replace('.', ',');
}
function showNum(t) { return t.replace('.', ',').replace(/^-/, '−'); }
function evalToks(ts) {
  const nums = [], ops = [];
  const apply = () => { const b = nums.pop(), a = nums.pop(), o = ops.pop();
    if (o === '/' && b === 0) throw new Error('DIV/0');
    nums.push(o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : a / b); };
  for (const t of ts) {
    if (isOp(t)) { while (ops.length && OPS[ops[ops.length - 1]] >= OPS[t]) apply(); ops.push(t); }
    else nums.push(parseFloat(t));
  }
  while (ops.length) apply();
  return nums[0];
}
function render(errMsg) {
  $('expr').firstChild.textContent = toks.map(t => isOp(t) ? ' ' + SYM[t] + ' ' : showNum(t)).join('');
  const r = $('res');
  if (errMsg) { r.textContent = errMsg; r.className = 'err'; return; }
  r.className = '';
  let v = '0';
  if (justEval && lastRes !== null) v = fmt(lastRes);
  else { const l = last(); if (l && !isOp(l)) v = showNum(l);
    else { try { const ts = toks.slice(0, isOp(l) ? -1 : undefined); if (ts.length) v = fmt(evalToks(ts)); } catch (e) {} } }
  r.textContent = v;
  // Schrift verkleinern bei langen Zahlen
  r.style.fontSize = v.length > 14 ? '30px' : v.length > 10 ? '38px' : '46px';
}
function renderTape() {
  const el = $('tape'); el.textContent = '';
  tape.slice(-3).forEach(t => { const d = document.createElement('div'); const a = document.createElement('span'); a.textContent = t.e + ' =';
    const b = document.createElement('b'); b.textContent = t.r; d.append(a, b);
    d.onclick = () => { toks = [t.v]; justEval = false; render(); }; el.appendChild(d); });
}
function press(k) {
  if (/^[0-9]$/.test(k)) {
    if (justEval) { toks = []; justEval = false; }
    const l = last();
    if (l && !isOp(l)) { if (l.replace(/[-.]/g, '').length >= 15) return; toks[toks.length - 1] = (l === '0' ? k : l === '-0' ? '-' + k : l + k); }
    else toks.push(k);
  } else if (k === '.') {
    if (justEval) { toks = []; justEval = false; }
    const l = last();
    if (l && !isOp(l)) { if (!l.includes('.')) toks[toks.length - 1] = l + '.'; }
    else toks.push('0.');
  } else if (isOp(k)) {
    if (justEval && lastRes !== null) { toks = [String(lastRes)]; justEval = false; }
    const l = last();
    if (!l) toks.push('0', k);
    else if (isOp(l)) toks[toks.length - 1] = k;
    else toks.push(k);
  } else if (k === 'N') {
    if (justEval && lastRes !== null) { toks = [String(lastRes)]; justEval = false; }
    const l = last();
    if (l && !isOp(l)) toks[toks.length - 1] = l.startsWith('-') ? l.slice(1) : '-' + l;
    else toks.push('-0');
  } else if (k === '%') {
    const l = last(); if (!l || isOp(l)) return;
    let v = parseFloat(l) / 100;
    const op = toks[toks.length - 2];
    if ((op === '+' || op === '-') && toks.length >= 3) { try { v = evalToks(toks.slice(0, -2)) * parseFloat(l) / 100; } catch (e) {} }
    toks[toks.length - 1] = String(parseFloat(v.toPrecision(12)));
  } else if (k === 'B') {
    if (justEval) { toks = []; justEval = false; lastRes = null; render(); return; }
    const l = last(); if (!l) return;
    if (isOp(l) || l.length <= 1 || l === '-0' || /^-\d$/.test(l)) toks.pop(); else toks[toks.length - 1] = l.slice(0, -1);
  } else if (k === 'C') {
    toks = []; justEval = false; lastRes = null; mood.flash('neutral', 10);
  } else if (k === '=') {
    if (!toks.length || justEval) return;
    if (isOp(last())) toks.pop();
    const exprTxt = toks.map(t => isOp(t) ? SYM[t] : showNum(t)).join('');
    try {
      const v = evalToks(toks);
      if (!isFinite(v)) throw new Error('ÜBERLAUF');
      lastRes = parseFloat(v.toPrecision(12)); justEval = true;
      if (toks.length > 1) { tape.push({e: exprTxt, r: fmt(lastRes), v: String(lastRes)}); tape = tape.slice(-20);
        try { localStorage.setItem('rechner.tape', JSON.stringify(tape)); } catch (e) {} renderTape(); }
      mood.jump();
    } catch (e) {
      toks = []; justEval = false; lastRes = null; render('FEHLER: ' + e.message); mood.flash('shock', 60); return;
    }
  }
  mood.poke();
  render();
}
$('keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  const m = {'Enter': '=', '=': '=', 'Backspace': 'B', 'Escape': 'C', ',': '.', 'x': '*', ':': '/'};
  const k = m[e.key] || e.key;
  if (/^[0-9.+\-*\/%=CB]$/.test(k)) { press(k); e.preventDefault();
    const b = document.querySelector('[data-k="' + CSS.escape(k) + '"]'); if (b) { b.classList.add('p'); setTimeout(() => b.classList.remove('p'), 90); } }
});

/* ================= Wetter Ruppach-Goldhausen ================= */
const PLACE = {name: 'Ruppach-Goldhausen', lat: 50.4667, lon: 7.8833};   // Fallback-Koordinaten
let W = null;
try { W = JSON.parse(localStorage.getItem('rechner.wx') || 'null'); } catch (e) {}
function category(c) {
  if (c === 0) return 'clear'; if (c <= 2) return 'partly'; if (c === 3) return 'cloudy';
  if (c === 45 || c === 48) return 'fog'; if (c >= 51 && c <= 57) return 'drizzle';
  if ((c >= 61 && c <= 67) || (c >= 80 && c <= 82)) return 'rain';
  if ((c >= 71 && c <= 77) || c === 85 || c === 86) return 'snow'; if (c >= 95) return 'thunder'; return 'cloudy';
}
async function loadWeather() {
  try {
    let lat = PLACE.lat, lon = PLACE.lon;
    try {
      const g = await (await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&language=de&country=DE&name=Ruppach-Goldhausen')).json();
      if (g.results && g.results[0]) { lat = g.results[0].latitude; lon = g.results[0].longitude; }
    } catch (e) {}
    const j = await (await fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,is_day,weather_code,wind_speed_10m&timezone=auto')).json();
    W = {t: j.current.temperature_2m, code: j.current.weather_code, isDay: !!j.current.is_day, wind: j.current.wind_speed_10m, time: Date.now()};
    try { localStorage.setItem('rechner.wx', JSON.stringify(W)); } catch (e) {}
  } catch (e) { /* offline: alte Daten behalten */ }
}

/* ================= Figur & Szene (160x72) ================= */
const FACES = {
  happy:   ['.3030303', '.3300033', '.3033303'],
  cool:    ['.3333333', '.3000003', '.3033303'],
  neutral: ['.3030303', '.3000003', '.3033303'],
  sad:     ['.3030303', '.3033303', '.3300033'],
  cold:    ['.3030303', '.3000003', '.3030303'],
  shock:   ['.3030303', '.3003003', '.3003003'],
  sleep:   ['.3000003', '.3330333', '.3000003'],
  think:   ['.3030303', '.3000003', '.3000303']
};
function botRows(face) { const h = BOT.head.slice(); const f = FACES[face] || FACES.neutral; h[3] = f[0]; h[4] = f[1]; h[5] = f[2]; return h; }
function sprite2(rows, x, y, map) {
  rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.') continue; rect(x + i * 2, y + j * 2, 2, 2, map ? map[+ch] : +ch); } });
}
const mood = {
  override: null, until: 0, jumpT: 0, awakeUntil: 0,
  flash(face, frames) { this.override = face; this.until = S.f + frames; },
  jump() { this.jumpT = 18; this.flash('happy', 40); },
  poke() { this.awakeUntil = S.f + 150; }
};
function weatherMood(cat, isDay, t) {
  if (!isDay && S.f > mood.awakeUntil) return 'sleep';
  if (cat === 'thunder') return 'shock';
  if (t <= 0 || cat === 'snow') return 'cold';
  if (cat === 'rain' || cat === 'drizzle') return 'sad';
  if (cat === 'fog') return 'think';
  if (cat === 'cloudy') return 'neutral';
  if (cat === 'clear' && isDay && t >= 20) return 'cool';
  return 'happy';
}
function draw() {
  const H = 72, GROUND = 58, f = S.f;
  const cat = W ? category(W.code) : 'partly', isDay = W ? W.isDay : true, temp = W ? W.t : 12, wind = W ? W.wind : 8;
  const skyMap = {clear: [0, 3], partly: [0, 3], cloudy: [1, 3], fog: [1, 2], drizzle: [1, 3], rain: [1, 3], snow: [1, 3], thunder: [2, 3]};
  const sky = skyMap[cat][isDay ? 0 : 1];
  rect(0, 0, 160, H, sky);
  if (!isDay && (cat === 'clear' || cat === 'partly' || cat === 'cloudy'))
    S.stars.forEach((s, i) => { if (s.y < 44 && (cat !== 'cloudy' || i % 3 === 0)) px(s.x, s.y - 14, ((f >> 4) + i) % 5 === 0 ? 2 : (i % 2 ? 0 : 1)); });
  if (cat === 'clear' || cat === 'partly') { if (isDay) drawSun(134, 27, f); else drawMoon(134, 25); }
  const hc = {0: [1, 2], 1: [2, 3], 2: [3, 3], 3: [2, 1]}[sky];
  for (let x = 0; x < 160; x++) { const X = x + f * 0.25;
    const h = 42 - Math.round((Math.sin(X / 23) * 6 + Math.sin(X / 9.7) * 2 + Math.sin(X / 51) * 4) / 2) * 2;
    rect(x, h, 1, GROUND - h, hc[0]); px(x, h, hc[1]); }
  const nCl = {clear: 1, partly: 2, cloudy: 4, fog: 2, drizzle: 3, rain: 4, snow: 3, thunder: 4}[cat];
  const spd = 0.15 + Math.min(wind, 60) / 80;
  for (let i = 0; i < nCl; i++) {
    let key = isDay ? ({thunder: 'cStorm', rain: 'cGrey', drizzle: 'cGrey'}[cat] || 'cDay') : 'cNight'; if (i % 2) key += '2';
    const img = SPR[key]; const span = 160 + img.width + 20;
    const x = ((i * 61 + f * spd * (1 + (i % 3) * 0.3)) % span) - img.width;
    g.drawImage(img, Math.round(160 - x - img.width), 12 + (i * 9) % 12);
  }
  for (let k = -1; k < 4; k++) g.drawImage(isDay ? SPR.bush : SPR.bushN, Math.round(k * 64 - (f % 64) + 40), GROUND - 11);
  for (let row = 0; row < 3; row++) { const ty = GROUND + row * 5; const off = (row % 2) * 4;
    for (let x = -16; x < 176; x += 8) { const tx = x - (f % 8) + off; rect(tx, ty, 8, 5, 2); rect(tx, ty + 4, 8, 1, 3); rect(tx + 7, ty, 1, 5, 3); px(tx, ty, 1); } }
  rect(0, GROUND - 1, 160, 1, 3);
  if (cat === 'snow') rect(0, GROUND - 2, 160, 2, 0);

  // Figur (doppelte Größe)
  let face = (mood.override && S.f < mood.until) ? mood.override : weatherMood(cat, isDay, temp);
  const precip = cat === 'rain' || cat === 'drizzle' || cat === 'thunder';
  const shiver = face === 'cold' ? ((f >> 1) & 1) : 0;
  let jy = 0; if (mood.jumpT > 0) { jy = Math.round(Math.sin((18 - mood.jumpT) / 18 * Math.PI) * 10); mood.jumpT--; }
  const walk = face !== 'sleep';
  const bx = 22 + shiver, by = GROUND - 20 - jy - (walk && ((f >> 3) & 1) && !shiver && !jy ? 1 : 0);
  const map = isDay ? null : [1, 1, 2, 3];
  sprite2(botRows(face), bx, by, map);
  sprite2(walk ? (((f >> 3) & 1) ? BOT.legA : BOT.legB) : BOT.legB, bx, by + 16, map);
  if (precip) { sprite2(UMB, bx + 2, by - 16, map); for (let y = by - 8; y < by + 12; y++) rect(bx + 15, y, 2, 1, 3); }
  // Gedankenblase
  const tx = bx + 20, ty = by - 2;
  if (face === 'sleep') { const z = (f >> 4) % 3; txt('Z', tx, ty - z * 3, isDay ? 3 : 0); if (z > 0) txt('Z', tx + 5, ty - 6 - z * 2, isDay ? 3 : 0); }
  if (face === 'think') txt('?', tx, ty, 3);
  if (face === 'shock' && (f >> 3) & 1) txt('!', tx, ty, sky >= 2 ? 0 : 3);
  if (face === 'cool' && mood.jumpT === 0) { const d = (f >> 2) % 6; px(bx - 2, by + 4 + d, 2); }
  // Niederschlag
  if (precip) {
    const n = cat === 'drizzle' ? 18 : cat === 'rain' ? 40 : 55, col = sky >= 2 ? 1 : (isDay ? 3 : 1), fall = cat === 'drizzle' ? 2 : 3.4;
    for (let i = 0; i < n; i++) { const p = S.parts[i]; p.y += fall * p.s; p.x -= (0.6 + wind / 40) * p.s;
      if (p.y >= GROUND - 2 || p.y > 70) { p.y = -4 - Math.random() * 20; p.x = Math.random() * 200; continue; }
      if (p.y > 72) p.y = -4;
      rect(p.x, p.y, 1, cat === 'drizzle' ? 2 : 3, col); }
  }
  if (cat === 'snow') {
    for (let i = 0; i < 45; i++) { const p = S.parts[i]; p.y += 0.45 * p.s; p.x += Math.sin((f + i * 17) / 18) * 0.35 - wind / 120;
      if (p.y > GROUND - 2) { p.y = -4; p.x = Math.random() * 180; } if (p.x < -3) p.x += 166;
      if (p.s > 1.1) { px(p.x, p.y - 1, 0); px(p.x - 1, p.y, 0); px(p.x + 1, p.y, 0); px(p.x, p.y + 1, 0); } else px(p.x, p.y, 0); }
  }
  if (cat === 'fog') g.drawImage(SPR.fog, -((f * 0.4) % 80), 10);
  if (cat === 'thunder') {
    if (S.flash <= 0 && Math.random() < 0.012) { S.flash = 12; let x = 50 + Math.random() * 90, y = 14; const pts = [[x, y]];
      while (y < GROUND - 2) { y += 5 + Math.random() * 6; x += (Math.random() - 0.5) * 14; pts.push([x, Math.min(y, GROUND - 2)]); } S.bolt = pts; }
    if (S.flash > 0) { if (S.flash > 9) rect(0, 0, 160, H, 0);
      for (let i = 1; i < S.bolt.length; i++) line(S.bolt[i - 1][0], S.bolt[i - 1][1], S.bolt[i][0], S.bolt[i][1], S.flash > 9 ? 3 : 0, 2);
      S.flash--; if (S.flash === 11) mood.flash('shock', 40); }
  }
  // HUD
  rect(0, 0, 160, 10, 3); rect(0, 10, 160, 1, 2);
  txt('RUPPACH-GOLDHAUSEN', 3, 3, 0);
  const ts = W ? Math.round(temp) + '°C' : '--';
  txt(ts, 157 - txtW(ts), 3, 0);
  S.f++;
}
let lastT = 0;
function loop(ts) { requestAnimationFrame(loop); if (document.hidden || ts - lastT < 33) return; lastT = ts; draw(); }

/* ================= Start ================= */
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function tick() { $('clock').textContent = hhmm(new Date()); }
resetScene(); renderTape(); render(); tick(); setInterval(tick, 10000);
requestAnimationFrame(loop);
if (!W || Date.now() - W.time > 15 * 60 * 1000) loadWeather();
setInterval(() => { if (!document.hidden) loadWeather(); }, 15 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && (!W || Date.now() - W.time > 15 * 60 * 1000)) loadWeather(); });
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
