<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>
window.onerror=function(m,s,l,c){if(/^Script error\.?$/.test(String(m))&&!l)return true;try{var d=document.getElementById('err');if(!d){d=document.createElement('pre');d.id='err';
d.onclick=function(){d.remove()};d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:14px 12px 30px;background:#a00;color:#fff;font:14px Menlo,monospace;white-space:pre-wrap';
(document.body||document.documentElement).appendChild(d);}d.textContent+='FEHLER: '+m+' (Zeile '+l+':'+c+')\n';
var b=document.getElementById('boot');if(b)b.remove();}catch(e){}};
window.addEventListener('unhandledrejection',function(e){window.onerror('Promise: '+(e.reason&&e.reason.message||e.reason),'',0,0);});
</script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="RECHNER">
<meta name="theme-color" content="#0000aa">
<title>RECHNER.EXE</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<style>
:root{--bg:#0000aa;--fg:#aaaaaa;--hi:#fff;--cy:#00aaaa;--lcy:#55ffff;--ye:#ffff55;--rd:#ff5555;--gr:#55ff55}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000}
body{font-family:'VT323',ui-monospace,Menlo,monospace;font-size:21px;line-height:1.15;color:var(--fg);-webkit-text-size-adjust:100%;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto;background:var(--bg)}
.bar{background:var(--fg);color:#000;padding:2px 8px;display:flex;justify-content:space-between;white-space:nowrap}
fieldset{margin:6px 8px 0;border:4px double var(--hi);padding:2px 8px 6px;min-width:0}
legend{color:var(--hi);padding:0 6px}
#tape{height:4.6em;overflow:hidden;font-size:18px;color:#7f7fd0;display:flex;flex-direction:column;justify-content:flex-end}
#tape div{display:flex;justify-content:space-between;cursor:pointer;white-space:nowrap;overflow:hidden}
#tape div b{color:var(--lcy);font-weight:normal;margin-left:8px}
.lcd{background:#000;margin-top:4px;padding:4px 8px;text-align:right;border:2px solid #555}
#expr{color:var(--fg);font-size:20px;min-height:1.2em;white-space:nowrap;overflow:hidden;direction:rtl;text-overflow:clip}
#expr span{direction:ltr;unicode-bidi:bidi-override}
#res{color:var(--ye);font-size:52px;line-height:1;white-space:nowrap;overflow:hidden}
#res.err{color:var(--rd);font-size:32px}
.keys{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;padding:12px 14px 10px;min-height:0}
.keys button{font:inherit;font-size:34px;border:0;border-radius:0;background:#aaa;color:#000;box-shadow:5px 5px 0 #000;cursor:pointer;padding:0;min-height:44px}
.keys button:active,.keys button.p{transform:translate(5px,5px);box-shadow:none}
.keys .op{background:var(--cy)}
.keys .c{background:#aa0000;color:#fff}
.keys .eq{background:#00aa00;color:#fff}
.keys .fn{background:#555;color:#fff}
.hint{font-size:16px;color:#6a6ac8;text-align:center;padding-bottom:4px}
</style>
</head>
<body>
<div class="screen">
  <div class="bar"><span>RECHNER.EXE</span><span id="clock">--:--</span></div>
  <fieldset>
    <legend>[ RECHNUNG ]</legend>
    <div id="tape"></div>
    <div class="lcd"><div id="expr"><span></span></div><div id="res">0</div></div>
  </fieldset>
  <div class="keys" id="keys">
    <button class="c" data-k="C">C</button><button class="fn" data-k="B">&lt;-</button><button class="fn" data-k="%">%</button><button class="op" data-k="/">÷</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button class="op" data-k="*">×</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button class="op" data-k="-">−</button>
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button class="op" data-k="+">+</button>
    <button class="fn" data-k="N">±</button><button data-k="0">0</button><button data-k=".">,</button><button class="eq" data-k="=">=</button>
  </div>
</div>
<script>
'use strict';
const $ = id => document.getElementById(id);

/* ================= Rechner ================= */
// Zustand: Liste aus Zahlen (als String) und Operatoren
let toks = [];          // z.B. ['12','+','3']
let justEval = false;   // nach "=" beginnt eine Ziffer neu
let lastRes = null;
let tape = []; try { tape = JSON.parse(localStorage.getItem('rechner.tape') || '[]'); } catch (e) {}
const OPS = {'+': 1, '-': 1, '*': 2, '/': 2};
const SYM = {'+': '+', '-': '−', '*': '×', '/': '÷'};
const isOp = t => t in OPS;
const last = () => toks[toks.length - 1];

function fmt(n) {
  if (!isFinite(n)) return 'FEHLER';
  if (Object.is(n, -0)) n = 0;
  let s;
  const a = Math.abs(n);
  if (a !== 0 && (a >= 1e12 || a < 1e-9)) s = n.toExponential(6).replace(/\.?0+e/, 'e');
  else s = String(parseFloat(n.toPrecision(12)));
  return s.replace('.', ',');
}
function showNum(t) { return t.replace('.', ',').replace(/^-/, '−'); }
function evalToks(ts) {
  const nums = [], ops = [];
  const apply = () => { const b = nums.pop(), a = nums.pop(), o = ops.pop();
    if (o === '/' && b === 0) throw new Error('DIV/0');
    nums.push(o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : a / b); };
  for (const t of ts) {
    if (isOp(t)) { while (ops.length && OPS[ops[ops.length - 1]] >= OPS[t]) apply(); ops.push(t); }
    else nums.push(parseFloat(t));
  }
  while (ops.length) apply();
  return nums[0];
}
function render(errMsg) {
  $('expr').firstChild.textContent = toks.map(t => isOp(t) ? ' ' + SYM[t] + ' ' : showNum(t)).join('');
  const r = $('res');
  if (errMsg) { r.textContent = errMsg; r.className = 'err'; return; }
  r.className = '';
  let v = '0';
  if (justEval && lastRes !== null) v = fmt(lastRes);
  else { const l = last(); if (l && !isOp(l)) v = showNum(l);
    else { try { const ts = toks.slice(0, isOp(l) ? -1 : undefined); if (ts.length) v = fmt(evalToks(ts)); } catch (e) {} } }
  r.textContent = v;
  // Schrift verkleinern bei langen Zahlen
  r.style.fontSize = v.length > 14 ? '32px' : v.length > 10 ? '42px' : '52px';
}
function renderTape() {
  const el = $('tape'); el.textContent = '';
  tape.slice(-3).forEach(t => { const d = document.createElement('div'); const a = document.createElement('span'); a.textContent = t.e + ' =';
    const b = document.createElement('b'); b.textContent = t.r; d.append(a, b);
    d.onclick = () => { toks = [t.v]; justEval = false; render(); }; el.appendChild(d); });
}
function press(k) {
  if (/^[0-9]$/.test(k)) {
    if (justEval) { toks = []; justEval = false; }
    const l = last();
    if (l && !isOp(l)) { if (l.replace(/[-.]/g, '').length >= 15) return; toks[toks.length - 1] = (l === '0' ? k : l === '-0' ? '-' + k : l + k); }
    else toks.push(k);
  } else if (k === '.') {
    if (justEval) { toks = []; justEval = false; }
    const l = last();
    if (l && !isOp(l)) { if (!l.includes('.')) toks[toks.length - 1] = l + '.'; }
    else toks.push('0.');
  } else if (isOp(k)) {
    if (justEval && lastRes !== null) { toks = [String(lastRes)]; justEval = false; }
    const l = last();
    if (!l) toks.push('0', k);
    else if (isOp(l)) toks[toks.length - 1] = k;
    else toks.push(k);
  } else if (k === 'N') {
    if (justEval && lastRes !== null) { toks = [String(lastRes)]; justEval = false; }
    const l = last();
    if (l && !isOp(l)) toks[toks.length - 1] = l.startsWith('-') ? l.slice(1) : '-' + l;
    else toks.push('-0');
  } else if (k === '%') {
    const l = last(); if (!l || isOp(l)) return;
    let v = parseFloat(l) / 100;
    const op = toks[toks.length - 2];
    if ((op === '+' || op === '-') && toks.length >= 3) { try { v = evalToks(toks.slice(0, -2)) * parseFloat(l) / 100; } catch (e) {} }
    toks[toks.length - 1] = String(parseFloat(v.toPrecision(12)));
  } else if (k === 'B') {
    if (justEval) { toks = []; justEval = false; lastRes = null; render(); return; }
    const l = last(); if (!l) return;
    if (isOp(l) || l.length <= 1 || l === '-0' || /^-\d$/.test(l)) toks.pop(); else toks[toks.length - 1] = l.slice(0, -1);
  } else if (k === 'C') {
    toks = []; justEval = false; lastRes = null; mood.flash('neutral', 10);
  } else if (k === '=') {
    if (!toks.length || justEval) return;
    if (isOp(last())) toks.pop();
    const exprTxt = toks.map(t => isOp(t) ? SYM[t] : showNum(t)).join('');
    try {
      const v = evalToks(toks);
      if (!isFinite(v)) throw new Error('ÜBERLAUF');
      lastRes = parseFloat(v.toPrecision(12)); justEval = true;
      if (toks.length > 1) { tape.push({e: exprTxt, r: fmt(lastRes), v: String(lastRes)}); tape = tape.slice(-20);
        try { localStorage.setItem('rechner.tape', JSON.stringify(tape)); } catch (e) {} renderTape(); }
      mood.jump();
    } catch (e) {
      toks = []; justEval = false; lastRes = null; render('FEHLER: ' + e.message); mood.flash('shock', 60); return;
    }
  }
  mood.poke();
  render();
}
$('keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
document.addEventListener('keydown', e => {
  const m = {'Enter': '=', '=': '=', 'Backspace': 'B', 'Escape': 'C', ',': '.', 'x': '*', ':': '/'};
  const k = m[e.key] || e.key;
  if (/^[0-9.+\-*\/%=CB]$/.test(k)) { press(k); e.preventDefault();
    const b = document.querySelector('[data-k="' + CSS.escape(k) + '"]'); if (b) { b.classList.add('p'); setTimeout(() => b.classList.remove('p'), 90); } }
});

const mood = {flash() {}, jump() {}, poke() {}};

/* ================= Start ================= */
function hhmm(d) { return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function tick() { $('clock').textContent = hhmm(new Date()); }
renderTape(); render(); tick(); setInterval(tick, 10000);
</script>
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') { try { navigator.serviceWorker.register('sw.js').catch(() => {}); } catch (e) {} }
</script>
</body>
</html>
